flags:
  - id: wallet-service
    name: wallet-service-mobile.rollout
    constant: WALLET_SERVICE_FEATURE_TOGGLE
    default: false
    gates: [wallet-service, network-settings, passkey-onboarding, wallet-load]
    combinesWith:
      - Needs a wallet-service URL in the network settings; an empty URL forces it off (and push off with it).
      - Ignored for 24 hours after a failed wallet-service start (IGNORE_WS_TOGGLE_FLAG); the wallet runs on the fullnode meanwhile.
      - Turning it off mid-session reloads the wallet on the fullnode at once; turning it on takes effect at the next wallet start.
    appliesAt: next-start
    status: active

  - id: push-notification
    name: push-notification.rollout
    constant: PUSH_NOTIFICATION_FEATURE_TOGGLE
    default: false
    gates: [push-notifications]
    combinesWith:
      - Always off on the shielded testnet.
      - Forced off when the network has no wallet-service URL.
      - Turning it off mid-session hides push at once; turning it on takes effect at the next wallet start.
    appliesAt: next-start
    status: active

  - id: reown
    name: reown.rollout
    constant: REOWN_FEATURE_TOGGLE
    default: false
    gates: [reown, dapp-rpc, qr-scanner, settings, token-register]
    combinesWith:
      - Needs nano contracts enabled on the network (server info nano_contracts_enabled).
      - Turning it off mid-session shuts the sessions down at once; turning it on starts Reown at the next wallet start.
    appliesAt: next-start
    status: active

  - id: network-settings
    name: network-settings.rollout
    constant: NETWORK_SETTINGS_FEATURE_TOGGLE
    default: false
    gates: [network-settings, settings]
    combinesWith:
      - Shows the Network Settings entry in the settings menu, read live.
    appliesAt: live
    status: active

  - id: nano-contract
    name: nano-contract.rollout
    constant: NANO_CONTRACT_FEATURE_TOGGLE
    default: false
    gates: [nano-contracts, token-swap, qr-scanner, token-register]
    combinesWith:
      - Needs nano contracts enabled on the network (server info nano_contracts_enabled).
      - Registered contracts load only at wallet start.
      - Required by token-swap.rollout and reown.rollout.
    appliesAt: next-start
    status: active

  - id: safe-biometry-mode
    name: safe-biometry-mode.rollout
    constant: SAFE_BIOMETRY_MODE_FEATURE_TOGGLE
    default: false
    gates: [biometrics]
    combinesWith:
      - The biometry storage is migrated the next time the PIN is read, using the last known flag value.
    appliesAt: next-pin
    status: active

  - id: token-swap
    name: token-swap.rollout
    constant: TOKEN_SWAP_FEATURE_TOGGLE
    default: false
    gates: [token-swap]
    combinesWith:
      - Needs nano-contract.rollout on and nano contracts enabled on the network.
      - The Swap tab appears or disappears live.
    appliesAt: live
    status: active

  - id: fee-based-tokens
    name: fee-based-tokens.rollout
    constant: FBT_FEATURE_TOGGLE
    default: false
    gates: [fee-tokens, token-create]
    combinesWith:
      - Decides the first create-token screen (type choice vs deposit notice) each time the wizard opens.
    appliesAt: live
    status: active

  - id: single-address
    name: single-address-mobile.rollout
    constant: SINGLE_ADDRESS_FEATURE_TOGGLE
    default: false
    gates: [address-mode, settings]
    combinesWith:
      - Shows the Address mode entry in settings live, but the wallet picks its address mode at the next start.
      - An active shielded chain or transactions past the first address keep the wallet in multi-address mode.
    appliesAt: next-start
    status: active

  - id: passkey-onboarding
    name: passkey-onboarding.rollout
    constant: PASSKEY_ONBOARDING_FEATURE_TOGGLE
    default: false
    gates: [passkey-onboarding]
    combinesWith:
      - Shows the passkey button on the onboarding screen, read live.
    appliesAt: live
    status: active

  - id: amount-format
    name: amount-format-mobile.rollout
    constant: AMOUNT_FORMAT_FEATURE_TOGGLE
    default: false
    gates: [amount-format, settings]
    combinesWith:
      - Shows the Amount format entry in settings and applies the chosen format, read live.
    appliesAt: live
    status: active

  - id: shielded-outputs
    name: shielded-outputs.rollout
    constant: SHIELDED_OUTPUTS_FEATURE_TOGGLE
    default: false
    gates: [shielded, shielded-send, shielded-receive, privacy-settings, token-create]
    combinesWith:
      - The shielded UI also needs the testnet-shielded-outputs network and a registered shielded provider.
      - Read with the current network, so it is off on the networks the user switches from.
      - The shielded UI is re-evaluated live and the shared address is read again.
    appliesAt: live
    status: active

  - id: shielded-outputs-network
    name: shielded-outputs-network.rollout
    constant: SHIELDED_NETWORK_PRESET_FEATURE_TOGGLE
    default: false
    gates: [network-settings]
    combinesWith:
      - Only shows the Shielded Testnet preset in Network Settings; needs network-settings.rollout to reach the screen.
    appliesAt: live
    status: active

axes:
  # Setup axes: expensive to change, they form the setups.
  - id: network
    name: Network
    kind: setup
    values:
      - { id: testnet, name: Public testnet }
      - { id: testnet-shielded, name: Shielded testnet (testnet-shielded-outputs) }
      - { id: local-privnet, name: Local privnet (mobile-e2e-flows) }
    how: QA.md "Common Activities" > "Changing Networks" (Settings > Network Settings > "I Understand" > pick a pre-setting or "Customize"); "Identifying the current network" to check it. The wallet restarts and flags are read again for the new network. The Shielded Testnet preset shows only with shielded-outputs-network.rollout on for the device on the current network (QA_SHIELDED.md). The local privnet is a Customize to the emulator's forwarded fullnode, in the debug build of `../mobile-e2e-flows`.
    switch:
      cost: expensive # QA: confirm
      transitions:
        - { from: testnet, to: local-privnet, cost: very-expensive, when: The privnet runs only in the e2e kit's emulator debug build; the run moves to another install } # QA: confirm
        - { from: testnet-shielded, to: local-privnet, cost: very-expensive, when: The privnet runs only in the e2e kit's emulator debug build; the run moves to another install } # QA: confirm
        - { from: local-privnet, to: testnet, cost: very-expensive, when: Leaving the e2e kit's emulator for a normal build } # QA: confirm
        - { from: local-privnet, to: testnet-shielded, cost: very-expensive, when: Leaving the e2e kit's emulator for a normal build } # QA: confirm

  - id: facade
    name: Wallet facade
    kind: setup
    values:
      - { id: wallet-service, name: Wallet service }
      - { id: fullnode, name: Fullnode }
    how: QA.md "Common Activities" > "Changing the Facade". To the fullnode, Customize the network and empty the "Wallet Service URL" and "Wallet Service WS URL" fields (or turn wallet-service-mobile.rollout off on Unleash for the device). Back to the wallet service, pick a pre-setting again. Check it with "Identifying the current facade". Trap, IGNORE_WS_TOGGLE_FLAG, from "Changing the Facade" > "Wallet Service". After an irrecoverable wallet-service error, the app stays on the fullnode for 24 hours, whatever the flag says. To get back to the wallet service sooner, clear the app data (Android) or reinstall (iOS) and import the wallet again. A passkey wallet stays on the fullnode unless it is registered on the wallet service.
    switch:
      cost: expensive # QA: confirm
      transitions: []
      fallback: { cost: very-expensive, how: "Clear the app data (Android) or reinstall (iOS), then import the wallet again: this clears IGNORE_WS_TOGGLE_FLAG" } # QA: confirm

  - id: wallet
    name: Wallet type
    kind: setup
    values:
      - { id: seed, name: Seed (24 words and PIN) }
      - { id: passkey, name: Passkey (no words and no PIN) }
    how: QA.md "Reset Wallet", then "New Wallet Flow" or "Import a wallet" for a seed wallet, or the passkey button on the onboarding screen (needs passkey-onboarding.rollout) for a passkey wallet.
    switch:
      cost: very-expensive # QA: confirm
      transitions: []

  - id: addr
    name: Address mode
    kind: setup
    values:
      - { id: single, name: Single address }
      - { id: multi, name: Multi address }
    how: QA.md "Address mode" and QA_ADDRESS_MODE.md. Settings > Address mode (needs single-address-mobile.rollout), then save; the wallet restarts. The mode is stored per network. At start the app moves a single-address wallet to multi when it finds transactions past index 0, and a wallet with an active shielded chain (seed wallets on the shielded testnet) is always multi.
    switch:
      cost: cheap # QA: confirm
      transitions:
        - { from: multi, to: single, impossible: true, when: wallet has tx past index 0 or a shielded chain is active }
      fallback: { cost: very-expensive, how: reset and import a fresh seed } # QA: confirm

  - id: flag-fbt
    name: fee-based-tokens.rollout
    kind: setup
    values:
      - { id: on, name: Flag on }
      - { id: off, name: Flag off }
    how: QA.md "Common Activities" > "Setting flags on Unleash", for the device's Unique app identifier on the current network. It applies live within the 15 s polling. On the local privnet, flags are forced by `E2E-LOCAL` edits to FEATURE_TOGGLE_DEFAULTS in the e2e worktree, so a change there needs a rebuild.
    switch:
      cost: medium # QA: confirm
      transitions: []

  # Action axes: cheap to vary inside one setup.
  - id: dest
    name: Destination address
    kind: action
    values:
      - { id: simple, name: Simple address (P2PKH) }
      - { id: multisig, name: Multisig address (P2SH) }
      - { id: shielded, name: Shielded address }
    how: Type, paste or scan the address on the send address screen. Keep one address of each kind of the current network at hand.
    switch:
      cost: cheap # QA: confirm
      transitions: []

  - id: token
    name: Token
    kind: action
    values:
      - { id: htr, name: HTR }
      - { id: deposit, name: Deposit-based custom token }
      - { id: fee, name: Fee-based custom token }
    how: Pick the token on the send amount screen (Change token), or open it from the home list. The wallet must already hold each kind (QA.md "Create a new token Tests").
    switch:
      cost: cheap # QA: confirm
      transitions: []

  - id: privacy
    name: Privacy mode
    kind: action
    values:
      - { id: public, name: Public }
      - { id: hide-amount, name: Hide amount }
      - { id: private, name: Private }
    how: The privacy selector on the send amount screen, shown only where private sends are possible (shielded testnet with shielded-outputs.rollout on). The default comes from Settings > Privacy.
    switch:
      cost: cheap # QA: confirm
      transitions: []

  - id: amount
    name: Amount
    kind: action
    values:
      - { id: normal, name: A normal amount below the balance }
      - { id: max, name: Exactly the available balance }
      - { id: over-balance, name: More than the available balance }
      - { id: empty, name: Zero or empty }
      - { id: decimals, name: Many decimal places }
      - { id: private-over-limit, name: Private amount at or above the shielded output limit (2^40) }
    how: Type it on the amount input.
    switch:
      cost: cheap # QA: confirm
      transitions: []

  - id: funding
    name: Funding before the action
    kind: action
    values:
      - { id: enough-htr, name: Holds the token and enough HTR for fees }
      - { id: zero-htr, name: Holds the token but no HTR }
    how: Send HTR or the token to the wallet beforehand from another wallet (on the local privnet, `sender/sender.js send`), or send all HTR away to reach zero HTR.
    switch:
      cost: medium # QA: confirm
      transitions: []

  - id: private-balance
    name: Private balance state
    kind: action
    values:
      - { id: unlocked, name: Unlocked }
      - { id: locked, name: Locked (scan key not decrypted at start) }
      - { id: broken-key, name: Broken key (shielded keys don't match) }
    how: QA_SHIELDED.md "A start that leaves the private funds locked" and "Unlocking a locked private balance". Locked needs a start with a PIN that doesn't decrypt the scan key, and broken key needs a forced shielded-key-mismatch; both are reachable only in a debug build. Unlock with "Unlock private balance" and the PIN, or the passkey.
    switch:
      cost: medium # QA: confirm
      transitions:
        - { from: unlocked, to: locked, cost: expensive, when: Needs a debug build and a wallet restart with a mismatched PIN } # QA: confirm
        - { from: unlocked, to: broken-key, cost: expensive, when: Needs a debug build that forces shielded-key-mismatch } # QA: confirm
        - { from: locked, to: broken-key, cost: expensive, when: Needs a debug build that forces shielded-key-mismatch } # QA: confirm

setups:
  # Public testnet, seed wallet: the main run (QA.md "Suggested Test Sequence").
  - id: tn-ws-seed-single
    name: Testnet, wallet service, seed, single address
    values: { network: testnet, facade: wallet-service, wallet: seed, addr: single, flag-fbt: on }
    environment: testnet
    runnable: true # QA: confirm
    notes: A new wallet starts in single-address mode; run it first, while no address past index 0 has transactions.
  - id: tn-ws-seed-multi
    name: Testnet, wallet service, seed, multi address
    values: { network: testnet, facade: wallet-service, wallet: seed, addr: multi, flag-fbt: on }
    environment: testnet
    runnable: true # QA: confirm
  - id: tn-ws-seed-multi-nofbt
    name: Testnet, wallet service, seed, multi address, fee-based tokens off
    values: { network: testnet, facade: wallet-service, wallet: seed, addr: multi, flag-fbt: off }
    environment: testnet
    runnable: true # QA: confirm
    notes: For create token, which offers only deposit tokens with the flag off.
  - id: tn-fn-seed-single
    name: Testnet, fullnode, seed, single address
    values: { network: testnet, facade: fullnode, wallet: seed, addr: single, flag-fbt: on }
    environment: testnet
    runnable: true # QA: confirm
    notes: Needs a wallet with no transactions past index 0 (a fresh seed), as multi to single is impossible otherwise.
  - id: tn-fn-seed-multi
    name: Testnet, fullnode, seed, multi address
    values: { network: testnet, facade: fullnode, wallet: seed, addr: multi, flag-fbt: on }
    environment: testnet
    runnable: true # QA: confirm
    notes: QA.md "Fullnode Facade tests".

  # Shielded testnet, seed wallet.
  - id: tns-ws-seed-multi
    name: Shielded testnet, wallet service, seed, multi address
    values: { network: testnet-shielded, facade: wallet-service, wallet: seed, addr: multi, flag-fbt: on }
    environment: testnet-shielded
    runnable: true # QA: confirm
    notes: Private sends to shielded recipients need the wallet service's shielded capability to be full.
  - id: tns-fn-seed-multi
    name: Shielded testnet, fullnode, seed, multi address
    values: { network: testnet-shielded, facade: fullnode, wallet: seed, addr: multi, flag-fbt: on }
    environment: testnet-shielded
    runnable: true # QA: confirm
  - id: tns-ws-seed-single
    name: Shielded testnet, wallet service, seed, single address
    values: { network: testnet-shielded, facade: wallet-service, wallet: seed, addr: single, flag-fbt: on }
    environment: testnet-shielded
    runnable: false
    notes: Unreachable. A seed wallet on the shielded testnet registers the shielded provider, and its shielded chain keeps it in multi-address mode (src/shielded/gating.js shouldRegisterShieldedProvider, src/screens/AddressMode.js).

  # Local privnet (../mobile-e2e-flows).
  - id: pn-fn-seed-multi
    name: Local privnet, fullnode, seed, multi address
    values: { network: local-privnet, facade: fullnode, wallet: seed, addr: multi, flag-fbt: on }
    environment: local-privnet
    runnable: true # QA: confirm
    notes: For large amounts and edge cases. Funded by the kit's `sender` wallet; flags are forced with `E2E-LOCAL` edits.
  - id: pn-ws-seed-multi
    name: Local privnet, wallet service, seed, multi address
    values: { network: local-privnet, facade: wallet-service, wallet: seed, addr: multi, flag-fbt: on }
    environment: local-privnet
    runnable: false
    notes: Unreachable today. The kit's privnet/docker-compose.yml runs only a fullnode and a tx-mining service, with no wallet service.

  # Passkey wallets: the passkey's RP ID needs a store-signed build on a physical device.
  - id: tn-ws-passkey-multi
    name: Testnet, wallet service, passkey, multi address
    values: { network: testnet, facade: wallet-service, wallet: passkey, addr: multi, flag-fbt: on }
    environment: store-device
    runnable: true # QA: confirm
    notes: The passkey wallet must already be registered on the wallet service, or it stays on the fullnode. passkey-onboarding.rollout must be on to create it.
  - id: tn-fn-passkey-multi
    name: Testnet, fullnode, passkey, multi address
    values: { network: testnet, facade: fullnode, wallet: passkey, addr: multi, flag-fbt: on }
    environment: store-device
    runnable: true # QA: confirm
  - id: tns-fn-passkey-multi
    name: Shielded testnet, fullnode, passkey, multi address
    values: { network: testnet-shielded, facade: fullnode, wallet: passkey, addr: multi, flag-fbt: on }
    environment: store-device
    runnable: true # QA: confirm
    notes: The passkey wallet needs its shielded keys, derived in a passkey ceremony, for shielded support; it unlocks its private balance with the passkey.
actions: []
constraints: []
