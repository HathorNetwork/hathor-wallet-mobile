flags:
  - id: wallet-service
    name: wallet-service-mobile.rollout
    constant: WALLET_SERVICE_FEATURE_TOGGLE
    default: false
    gates: [wallet-service, network-settings, passkey-onboarding, wallet-load]
    combinesWith:
      - Needs a wallet-service URL in the network settings; an empty URL forces it off (and push off with it).
      - Ignored for 24 hours after a failed wallet-service start (IGNORE_WS_TOGGLE_FLAG); the wallet runs on the fullnode meanwhile.
      - Turning it off mid-session reloads the wallet on the fullnode at once; turning it on takes effect at the next wallet start.
    appliesAt: next-start
    status: active

  - id: push-notification
    name: push-notification.rollout
    constant: PUSH_NOTIFICATION_FEATURE_TOGGLE
    default: false
    gates: [push-notifications]
    combinesWith:
      - Always off on the shielded testnet.
      - Forced off when the network has no wallet-service URL.
      - Turning it off mid-session hides push at once; turning it on takes effect at the next wallet start.
    appliesAt: next-start
    status: active

  - id: reown
    name: reown.rollout
    constant: REOWN_FEATURE_TOGGLE
    default: false
    gates: [reown, dapp-rpc, qr-scanner, settings, token-register]
    combinesWith:
      - Needs nano contracts enabled on the network (server info nano_contracts_enabled).
      - Turning it off mid-session shuts the sessions down at once; turning it on starts Reown at the next wallet start.
    appliesAt: next-start
    status: active

