MIN_TX_WEIGHT_K: 0
MIN_TX_WEIGHT_COEFFICIENT: 0
MIN_TX_WEIGHT: 1
# Blocks at weight 1 keep the dev miner near idle. The fullnode refuses --test-mode-*-weight
# under a testnet-* name, and the app's shielded UI needs this name. The genesis block hash and
# nonce above are for weight 1 (hathor-core: python -m hathor_cli.main gen_genesis
# --tokens 100000000000 --address WY1URKUnqCTyiixW1Dw29vmeG99hNN4EW6
# --block-timestamp 1643902665 --min-block-weight 1 --min-tx-weight 1).
MIN_BLOCK_WEIGHT: 1
REWARD_SPEND_MIN_BLOCKS: 1
AVG_TIME_BETWEEN_BLOCKS: 1
CHECKPOINTS: []
ENABLE_NANO_CONTRACTS: enabled
ENABLE_FEE_BASED_TOKENS: enabled
ENABLE_SHIELDED_TRANSACTIONS: enabled
