appId: network.hathor.wallet
---
# New wallet on the local privnet -> dashboard. Run bin/app-on-privnet.sh --fresh first: it wipes
# the app and points it at the privnet, which is why this flow doesn't clear the app's state.
# Elements are found by the app's testIDs; text is for what the flow checks is on screen
# (QA/e2e/README.md "Selectors").
- launchApp
- extendedWaitUntil:
    visible: "Welcome to Hathor Wallet!"
    timeout: 180000
- tapOn:
    id: welcome-terms-switch
- assertVisible:
    id: welcome-terms-switch
    checked: true
# Right after a cold launch the JS thread may lag and drop the first tap; retry START.
- repeat:
    times: 20
    while:
      visible: "Welcome to Hathor Wallet!"
    commands:
      - tapOn:
          id: welcome-start
      - extendedWaitUntil:
          visible:
            id: onboarding-new-wallet
          timeout: 3000
          optional: true
- tapOn:
    id: onboarding-new-wallet
- extendedWaitUntil:
    visible: "Your wallet has been created!"
    timeout: 30000
- evalScript: ${output.i = 1}
- repeat:
    times: 24
    commands:
      # "<position>. <word>"
      - copyTextFrom:
          id: new-words-word-${output.i}
      - runScript: captureWord.js
- tapOn:
    id: new-words-next
# The app asks for 5 words. The success modal is drawn over the screen, whose question stays in
# the view tree under it: the loop stops on the modal too, or it taps on through it.
- repeat:
    times: 10
    while:
      visible: "Please select the word that corresponds to the number below:"
      notVisible: "Words saved correctly"
    commands:
      - copyTextFrom:
          id: backup-words-position
      - runScript: lookupWord.js
      - evalScript: ${console.log("asked " + maestro.copiedText + " -> " + output.correctWord)}
      - tapOn:
          text: "${output.correctWord.toUpperCase()}"
          # What the run's logs and viewer show in place of the seed word.
          label: "Tap the word asked for"
# The success modal after the backup check has no button: it closes on a tap on its backdrop.
# A point, since an id's tap lands on the element's centre, which the modal covers.
- extendedWaitUntil:
    visible: "Words saved correctly"
    timeout: 10000
- tapOn:
    point: "50%,10%"
- runFlow: pin.yaml
- tapOn:
    id: choose-pin-start-wallet
- extendedWaitUntil:
    visible: "Custom network: testnet-shielded-outputs"
    timeout: 120000
- extendedWaitUntil:
    visible: "HTR"
    timeout: 180000
- takeScreenshot: dashboard  # relative: lands in --test-output-dir
# The runner reads the seed from this line to derive the wallet's addresses (throwaway, privnet).
- evalScript: ${console.log("E2E_SEED " + output.seedWords)}
