appId: network.hathor.wallet
---
# Registers the custom tokens minted for the wallet, through the dashboard's "New tokens" banner.
- extendedWaitUntil:
    visible: "Import tokens"
    timeout: 60000
# The link is a Text inside the banner's Text: Android renders it as a span of its parent, with
# no view of its own to carry a testID, so it's found by its text.
- tapOn: "Import tokens"
- extendedWaitUntil:
    visible: "Tokens found \\(3\\)"
    timeout: 30000
- tapOn: "E2E Deposit"
- tapOn: "E2E Large"
- tapOn: "E2E Fee"
- tapOn:
    id: import-tokens-continue
- extendedWaitUntil:
    visible: "Confirm Import"
    timeout: 15000
- tapOn:
    id: confirm-import-tokens
- extendedWaitUntil:
    visible: "New tokens added!"
    timeout: 30000
- tapOn:
    id: import-tokens-see-all
- extendedWaitUntil:
    visible: "E2E Fee"
    timeout: 15000
