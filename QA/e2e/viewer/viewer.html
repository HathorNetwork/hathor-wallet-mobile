  The e2e run viewer. run.js copies it into each run's evidence dir as viewer.html, with the
  run's data in place of RUN_DATA below: the chapters (onboarding, the token import, each
  scenario), each with its screen recording and its timeline. No server or build: open the file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e2e run</title>
<style>
  :root {
    --bg: #101214; --panel: #181b1f; --line: #2a2f36; --text: #e6e8eb; --dim: #8b929c;
    --pass: #3fb950; --fail: #f85149; --skip: #8b929c; --run: #e3b341; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  header select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  .speed { font-variant-numeric: tabular-nums; padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; }
  .keys { margin-left: auto; color: var(--dim); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: 330px auto 1fr; min-height: 0; }
  #playlist { overflow-y: auto; border-right: 1px solid var(--line); }
  #playlist .item { padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: start; }
  #playlist .item:hover { background: var(--panel); }
  #playlist .item.current { background: #1f2a37; }
  #playlist .item.novideo { cursor: default; opacity: .55; }
  #playlist .title { font-size: 12.5px; word-break: break-word; }
  #playlist .sub { color: var(--dim); font-size: 11.5px; }
  .st-passed, .st-done { color: var(--pass); } .st-failed { color: var(--fail); } .st-skipped { color: var(--skip); }
  .review { font-size: 11px; white-space: nowrap; }
  .review.ok { color: var(--pass); } .review.changed { color: var(--run); }
  #stage { display: flex; flex-direction: column; align-items: center; padding: 10px; gap: 8px; min-height: 0; }
  #caption { width: 100%; max-width: 460px; min-height: 3.2em; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  #caption .group { font-weight: 600; }
  #caption .leaf { color: var(--dim); }
  video { flex: 1; min-height: 0; max-height: 100%; aspect-ratio: 1080 / 2400; background: #000; border-radius: 10px; border: 1px solid var(--line); }
  #strip { position: relative; width: 100%; max-width: 460px; height: 14px; background: var(--panel); border-radius: 3px; cursor: pointer; overflow: hidden; }
  #strip .seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--bg); }
  #strip .skip { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255,255,255,.18) 3px 6px); }
  #strip .head { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2d333b; padding: 6px 12px; border-radius: 6px; font-size: 12.5px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #details { overflow-y: auto; padding: 10px 14px; border-left: 1px solid var(--line); min-width: 0; }
  #details h2 { font-size: 14px; margin: 0 0 4px; word-break: break-word; }
  #details .facts { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
  #details .facts b { color: var(--text); font-weight: 500; }
  #details button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; margin: 2px 0 10px; }
  #details button:hover { border-color: var(--accent); }
  .entry { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; font-size: 12.5px; }
  .entry:hover { background: var(--panel); }
  .entry.group { font-weight: 600; margin-top: 4px; }
  .entry.runner { color: var(--dim); font-style: italic; }
  .entry.running { background: #3a3117; }
  .entry .time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .entry .text { word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1 id="run-title">e2e run</h1>
  <span class="meta" id="run-meta"></span>
  <label><input type="checkbox" id="skip" checked> Skip long waits <kbd>L</kbd></label>
  <label><input type="checkbox" id="autoplay" checked> Play the next one</label>
  <label>Show <select id="filter">
    <option value="all">all</option>
    <option value="review">not validated, or changed since</option>
    <option value="failed">failed</option>
  </select></label>
  <span class="speed" id="speed">1×</span>
  <span class="keys"><kbd>Q</kbd> 1× <kbd>S</kbd> 1.5× <kbd>W</kbd> 2× · <kbd>←</kbd><kbd>→</kbd> 5 s · <kbd>Space</kbd> play · <kbd>N</kbd><kbd>P</kbd> next, previous · <kbd>V</kbd> validated</span>
</header>
<main>
  <nav id="playlist"></nav>
  <section id="stage">
    <div id="caption"></div>
    <video id="video" controls muted playsinline></video>
    <div id="strip"></div>
  </section>
  <section id="details"></section>
</main>
<div id="toast"></div>
<script>
const RUN = /* RUN_DATA */ null;

const $ = (id) => document.getElementById(id);
const video = $('video');
const chapters = RUN.chapters;
let current = -1;
let rendered = [];
let userRange = null; // a skip range the viewer seeked into on purpose: not skipped
const STATUS_ICON = { passed: '✓', done: '✓', failed: '✗', skipped: '–' };
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('run-title').textContent = `e2e run · ${RUN.setup}`;
$('run-meta').textContent = `${RUN.startedAt.replace('T', ' ').slice(0, 19)} UTC · ${RUN.branch} @ ${RUN.toolsCommit}`;

// Which scenarios someone has watched, kept in this browser: the flow version they watched.
const reviewKey = (c) => `e2e-validated:${c.id}`;
function review(c) {
  if (c.kind !== 'scenario' || !c.flowVersion) return null;
  const saved = JSON.parse(localStorage.getItem(reviewKey(c)) || 'null');
  if (!saved) return { state: 'none', text: '' };
  return saved.flowVersion === c.flowVersion
    ? { state: 'ok', text: 'validated' }
    : { state: 'changed', text: 'changed since validated' };
}
function toggleValidated() {
  const c = chapters[current];
  if (!c || !review(c)) return;
  if (review(c).state === 'ok') localStorage.removeItem(reviewKey(c));
  else localStorage.setItem(reviewKey(c), JSON.stringify({ flowVersion: c.flowVersion, at: new Date().toISOString(), run: RUN.startedAt }));
  renderPlaylist();
  renderDetails();
  toast(review(c).state === 'ok' ? 'Marked validated' : 'Validation removed');
}

function visible(c) {
  const f = $('filter').value;
  if (f === 'failed') return c.status === 'failed';
  if (f === 'review') { const r = review(c); return Boolean(r) && r.state !== 'ok'; }
  return true;
}

function renderPlaylist() {
  $('playlist').innerHTML = chapters.map((c, i) => {
    if (!visible(c)) return '';
    const r = review(c);
    const sub = c.kind === 'scenario'
      ? (c.expected ? `expects ${esc(c.expected.id)}` : '') + (c.status === 'skipped' ? ` · ${esc(c.notes)}` : '')
      : 'setup';
    return `<div class="item ${i === current ? 'current' : ''} ${c.video ? '' : 'novideo'}" data-i="${i}">
      <span class="st-${c.status}">${STATUS_ICON[c.status] || '•'}</span>
      <div><div class="title">${esc(c.title)}</div><div class="sub">${sub}${c.duration ? ` · ${fmt(c.duration)}` : ''}</div></div>
      <span class="review ${r ? r.state : ''}">${r ? r.text : ''}</span></div>`;
  }).join('');
  $('playlist').querySelectorAll('.item').forEach((el) => {
    el.onclick = () => { const i = Number(el.dataset.i); if (chapters[i].video) play(i); };
  });
  const el = $('playlist').querySelector('.item.current');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function renderDetails() {
  const c = chapters[current];
  if (!c) { $('details').innerHTML = ''; return; }
  const r = review(c);
  const facts = [];
  if (c.values) facts.push(Object.entries(c.values).map(([k, v]) => `${esc(k)} <b>${esc(v)}</b>`).join(' · '));
  if (c.expected) facts.push(`Expected: <b>${esc(c.expected.id)}</b>, "${esc(c.expected.message.replace(/\*\*/g, ''))}"`);
  facts.push(`Result: <b class="st-${c.status}">${esc(c.status)}</b>${c.notes ? `, ${esc(c.notes)}` : ''}`);
  $('details').innerHTML = `<h2>${esc(c.id)}</h2><div class="facts">${facts.join('<br>')}</div>
    ${r ? `<button id="validate">${r.state === 'ok' ? 'Validated ✓ (V to undo)' : 'Mark validated (V)'}</button>` : ''}
    <div id="entries">${c.entries.map((e, i) => `<div class="entry ${e.depth === 0 ? 'group' : ''} ${e.runner ? 'runner' : ''}" data-i="${i}" style="padding-left:${4 + e.depth * 16}px">
      <span class="mark"></span><span class="text">${esc(e.text)}</span><span class="time">${fmt(e.t)}</span></div>`).join('')}</div>`;
  if ($('validate')) $('validate').onclick = toggleValidated;
  rendered = [...$('details').querySelectorAll('.entry')];
  rendered.forEach((el) => { el.onclick = () => seek(c.entries[Number(el.dataset.i)].t - 0.3, true); });
}

function renderStrip() {
  const c = chapters[current];
  const pct = (t) => `${(100 * t) / c.duration}%`;
  const hues = [210, 150, 40, 280, 0, 180];
  const groups = c.entries.filter((e) => e.depth === 0);
  $('strip').innerHTML = groups.map((g, i) => `<div class="seg" title="${esc(g.text)}" style="left:${pct(g.t)};width:${pct(g.d)};background:hsl(${hues[i % hues.length]} 45% 35%)"></div>`).join('')
    + c.skips.map(([a, b]) => `<div class="skip" title="long wait" style="left:${pct(a)};width:${pct(b - a)}"></div>`).join('')
    + '<div class="head" id="head"></div>';
}
$('strip').onclick = (ev) => {
  const c = chapters[current];
  const box = $('strip').getBoundingClientRect();
  seek(((ev.clientX - box.left) / box.width) * c.duration, true);
};

function play(i) {
  current = i;
  userRange = null;
  const rate = video.playbackRate;
  video.src = chapters[i].video;
  video.playbackRate = rate;
  video.play().catch(() => {});
  renderPlaylist();
  renderDetails();
  renderStrip();
}

function step(dir) {
  for (let i = current + dir; i >= 0 && i < chapters.length; i += dir) {
    if (chapters[i].video && visible(chapters[i])) { play(i); return true; }
  }
  return false;
}

function seek(t, onPurpose) {
  const c = chapters[current];
  if (!c) return;
  const to = Math.max(0, Math.min(t, (video.duration || c.duration) - 0.05));
  userRange = onPurpose ? c.skips.find(([a, b]) => to >= a && to < b) || null : null;
  video.currentTime = to;
}

let toastTimer;
function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1200);
}

function setSpeed(rate) {
  video.playbackRate = rate;
  $('speed').textContent = `${rate}×`;
  toast(`Speed ${rate}×`);
}

// Follows the video: the running entries, the caption, the strip's head, the long waits.
function tick() {
  const c = chapters[current];
  if (c && c.entries) {
    const t = video.currentTime;
    if ($('skip').checked && !video.paused) {
      const range = c.skips.find(([a, b]) => t >= a && t < b);
      if (range && range !== userRange) {
        video.currentTime = range[1];
        toast(`Skipped ${Math.round(range[1] - range[0])} s of waiting`);
      }
    }
    let group = null;
    let leaf = null;
    c.entries.forEach((e, i) => {
      const el = rendered[i];
      const running = t >= e.t && t < e.t + Math.max(e.d, 0.25);
      const done = t >= e.t + e.d;
      el.classList.toggle('running', running);
      let mark = '☐';
      if (running) mark = '⏳';
      else if (done) mark = e.status === 'failed' ? '✗' : e.status === 'warned' ? '!' : '✓';
      if (el.firstElementChild.textContent !== mark) el.firstElementChild.textContent = mark;
      if (running && e.depth === 0) group = e;
      if (running && (!leaf || e.depth >= leaf.depth)) leaf = e;
    });
    const groupText = group ? esc(group.text) : '';
    const leafText = leaf && leaf !== group ? esc(leaf.text) : '';
    const html = `<div class="group">${groupText || '&nbsp;'}</div><div class="leaf">${leafText || '&nbsp;'}</div>`;
    if ($('caption').innerHTML !== html) $('caption').innerHTML = html;
    const head = $('head');
    if (head) head.style.left = `${(100 * t) / c.duration}%`;
    const running = rendered.find((el) => el.classList.contains('running'));
    if (running && !video.paused) running.scrollIntoView({ block: 'nearest' });
  }
  requestAnimationFrame(tick);
}

video.addEventListener('ended', () => { if ($('autoplay').checked) step(1); });
$('filter').onchange = renderPlaylist;

// Capture phase: the video's own controls would take the arrows and the space first.
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'SELECT' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  const actions = {
    q: () => setSpeed(1),
    s: () => setSpeed(1.5),
    w: () => setSpeed(2),
    ArrowLeft: () => seek(video.currentTime - 5, true),
    ArrowRight: () => seek(video.currentTime + 5, true),
    ' ': () => (video.paused ? video.play() : video.pause()),
    n: () => step(1),
    p: () => step(-1),
    v: toggleValidated,
    l: () => { $('skip').checked = !$('skip').checked; toast(`Skip long waits: ${$('skip').checked ? 'on' : 'off'}`); },
  };
  if (actions[key]) {
    ev.preventDefault();
    actions[key]();
  }
}, true);

renderPlaylist();
if (!step(1)) $('caption').textContent = 'This run has no recordings.';
requestAnimationFrame(tick);
</script>
</body>
</html>
